<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图层变换功能测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }
        h2 {
            color: #555;
            margin-top: 30px;
        }
        .canvas-container {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        canvas {
            border: 2px solid #ddd;
            border-radius: 4px;
            background: white;
        }
        .controls {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
        }
        .control-group {
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
        }
        .control-group label {
            display: inline-block;
            width: 180px;
            font-weight: bold;
            color: #555;
        }
        input[type="range"] {
            width: 200px;
            vertical-align: middle;
        }
        input[type="number"] {
            width: 80px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 8px 16px;
            margin: 5px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #0056b3;
        }
        button.secondary {
            background: #6c757d;
        }
        button.secondary:hover {
            background: #545b62;
        }
        button.success {
            background: #28a745;
        }
        button.success:hover {
            background: #218838;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
            border-left: 4px solid #17a2b8;
        }
        .layer-list {
            list-style: none;
            padding: 0;
        }
        .layer-item {
            padding: 8px;
            margin: 5px 0;
            background: #e9ecef;
            border-radius: 4px;
            cursor: pointer;
        }
        .layer-item:hover {
            background: #dee2e6;
        }
        .layer-item.active {
            background: #007bff;
            color: white;
        }
        .value-display {
            display: inline-block;
            width: 60px;
            text-align: right;
            font-family: monospace;
            color: #007bff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>图层变换功能测试</h1>
        
        <div class="info">
            <strong>功能说明：</strong><br>
            1. 以画布任意点为变换中心<br>
            2. 以其他图层中心为参照点进行变换<br>
            3. 批量变换操作<br>
            4. 其他辅助功能（居中、对齐、获取边界等）
        </div>

        <div class="canvas-container">
            <canvas id="mainCanvas" width="400" height="400"></canvas>
            <canvas id="layer1Canvas" width="200" height="200"></canvas>
            <canvas id="layer2Canvas" width="200" height="200"></canvas>
        </div>

        <h2>图层选择</h2>
        <div class="controls">
            <ul class="layer-list">
                <li class="layer-item active" id="layer1-item" onclick="selectLayer(1)">图层 1 (红色方块)</li>
                <li class="layer-item" id="layer2-item" onclick="selectLayer(2)">图层 2 (蓝色圆形)</li>
            </ul>
        </div>

        <h2>基础变换（当前图层）</h2>
        <div class="controls">
            <div class="control-group">
                <label>缩放 X:</label>
                <input type="range" id="scaleX" min="0.1" max="3" step="0.1" value="1" oninput="updateTransform()">
                <span class="value-display" id="scaleX-val">1.0</span>
            </div>
            <div class="control-group">
                <label>缩放 Y:</label>
                <input type="range" id="scaleY" min="0.1" max="3" step="0.1" value="1" oninput="updateTransform()">
                <span class="value-display" id="scaleY-val">1.0</span>
            </div>
            <div class="control-group">
                <label>旋转角度:</label>
                <input type="range" id="rotation" min="-180" max="180" step="5" value="0" oninput="updateTransform()">
                <span class="value-display" id="rotation-val">0°</span>
            </div>
            <div class="control-group">
                <label>位置 X:</label>
                <input type="range" id="posX" min="-150" max="150" step="5" value="0" oninput="updateTransform()">
                <span class="value-display" id="posX-val">0</span>
            </div>
            <div class="control-group">
                <label>位置 Y:</label>
                <input type="range" id="posY" min="-150" max="150" step="5" value="0" oninput="updateTransform()">
                <span class="value-display" id="posY-val">0</span>
            </div>
            <div class="control-group">
                <label>变换原点 X:</label>
                <input type="range" id="originX" min="0" max="1" step="0.1" value="0.5" oninput="updateTransform()">
                <span class="value-display" id="originX-val">0.5</span>
            </div>
            <div class="control-group">
                <label>变换原点 Y:</label>
                <input type="range" id="originY" min="0" max="1" step="0.1" value="0.5" oninput="updateTransform()">
                <span class="value-display" id="originY-val">0.5</span>
            </div>
            <button onclick="resetTransform()">重置变换</button>
            <button class="secondary" onclick="centerLayer()">居中</button>
        </div>

        <h2>外部变换中心</h2>
        <div class="controls">
            <div class="info">
                设置外部变换中心后，缩放和旋转将以该点为中心进行
            </div>
            <div class="control-group">
                <label>变换中心 X:</label>
                <input type="number" id="transformCenterX" value="200" step="10">
            </div>
            <div class="control-group">
                <label>变换中心 Y:</label>
                <input type="number" id="transformCenterY" value="200" step="10">
            </div>
            <button onclick="setTransformCenter()">设置变换中心</button>
            <button class="secondary" onclick="clearTransformCenter()">清除变换中心</button>
            <button class="success" onclick="setTransformCenterFromClick()">点击画布设置中心</button>
        </div>

        <h2>以其他图层为参照</h2>
        <div class="controls">
            <div class="info">
                当前图层将参照另一个图层的中心进行变换
            </div>
            <button onclick="setReferenceLayer(1)">参照图层 1</button>
            <button onclick="setReferenceLayer(2)">参照图层 2</button>
            <button class="secondary" onclick="clearReferenceLayer()">清除参照</button>
        </div>

        <h2>批量操作</h2>
        <div class="controls">
            <button onclick="batchScale()">批量缩放 (1.5x)</button>
            <button onclick="batchRotate()">批量旋转 (45°)</button>
            <button class="secondary" onclick="batchMove()">批量移动</button>
            <button class="success" onclick="batchCenter()">批量居中</button>
            <button onclick="alignLayers()">对齐到图层 1</button>
        </div>

        <h2>图层信息</h2>
        <div class="controls">
            <button onclick="showLayerInfo()">显示图层变换信息</button>
            <button onclick="showLayerBounds()">显示图层边界</button>
        </div>

        <h2>渲染结果</h2>
        <div class="controls">
            <button class="success" onclick="renderAll()">渲染合成图像</button>
        </div>
    </div>

    <script>
        let layerStack;
        let currentLayerId = 1;
        let isSettingTransformCenter = false;

        // 导出所有需要从HTML调用的函数
        window.selectLayer = function(id) {
            currentLayerId = id;
            document.querySelectorAll('.layer-item').forEach((item, index) => {
                item.classList.toggle('active', index + 1 === id);
            });
            window.loadLayerTransform();
        };

        window.updateTransform = function() {
            window.updateValueDisplays();
            
            const scaleX = parseFloat(document.getElementById('scaleX').value);
            const scaleY = parseFloat(document.getElementById('scaleY').value);
            const rotation = parseFloat(document.getElementById('rotation').value);
            const posX = parseFloat(document.getElementById('posX').value);
            const posY = parseFloat(document.getElementById('posY').value);
            const originX = parseFloat(document.getElementById('originX').value);
            const originY = parseFloat(document.getElementById('originY').value);
            
            layerStack.set_layer_scale(currentLayerId, scaleX, scaleY);
            layerStack.set_layer_rotation(currentLayerId, rotation);
            layerStack.set_layer_position(currentLayerId, posX, posY);
            
            const layer = layerStack.get_layer(currentLayerId);
            layer.set_origin(originX, originY);
            
            window.renderAll();
        };

        window.resetTransform = function() {
            const layer = layerStack.get_layer(currentLayerId);
            layer.reset_transform();
            window.loadLayerTransform();
            window.renderAll();
        };

        window.centerLayer = function() {
            layerStack.center_layer(currentLayerId);
            window.loadLayerTransform();
            window.renderAll();
        };

        window.setTransformCenter = function() {
            const centerX = parseFloat(document.getElementById('transformCenterX').value);
            const centerY = parseFloat(document.getElementById('transformCenterY').value);
            layerStack.set_transform_center_on_canvas(currentLayerId, centerX, centerY);
            window.renderAll();
            console.log(`设置变换中心: (${centerX}, ${centerY})`);
        };

        window.clearTransformCenter = function() {
            const layer = layerStack.get_layer(currentLayerId);
            layer.clear_transform_center();
            window.renderAll();
            console.log("清除变换中心");
        };

        window.setTransformCenterFromClick = function() {
            isSettingTransformCenter = true;
            document.getElementById('mainCanvas').style.cursor = 'crosshair';
            console.log("点击画布设置变换中心");
        };

        window.setReferenceLayer = function(refId) {
            layerStack.set_transform_reference_layer(currentLayerId, refId);
            window.renderAll();
            console.log(`图层 ${currentLayerId} 现在参照图层 ${refId}`);
        };

        window.clearReferenceLayer = function() {
            layerStack.set_transform_reference_layer(currentLayerId, null);
            window.renderAll();
            console.log("清除参照图层");
        };

        window.batchScale = function() {
            const ids = layerStack.get_layer_ids();
            const count = layerStack.batch_set_scale_uniform(ids, 1.5);
            window.loadLayerTransform();
            window.renderAll();
            console.log(`批量缩放了 ${count} 个图层`);
        };

        window.batchRotate = function() {
            const ids = layerStack.get_layer_ids();
            const count = layerStack.batch_set_rotation(ids, 45);
            window.loadLayerTransform();
            window.renderAll();
            console.log(`批量旋转了 ${count} 个图层`);
        };

        window.batchMove = function() {
            const ids = layerStack.get_layer_ids();
            const count = layerStack.batch_move_layers(ids, 20, -20);
            window.loadLayerTransform();
            window.renderAll();
            console.log(`批量移动了 ${count} 个图层`);
        };

        window.batchCenter = function() {
            const ids = layerStack.get_layer_ids();
            const count = layerStack.batch_center_layers(ids);
            window.loadLayerTransform();
            window.renderAll();
            console.log(`批量居中了 ${count} 个图层`);
        };

        window.alignLayers = function() {
            const ids = layerStack.get_layer_ids().filter(id => id !== 1);
            layerStack.align_layers_to_layer(ids, 1);
            window.loadLayerTransform();
            window.renderAll();
            console.log("所有图层已对齐到图层1");
        };

        window.showLayerInfo = function() {
            const info = layerStack.get_layer_transform_info(currentLayerId);
            if (info) {
                console.log(info);
                alert(info);
            }
        };

        window.showLayerBounds = function() {
            const bounds = layerStack.get_layer_bounds(currentLayerId);
            if (bounds) {
                console.log(`图层边界: x=${bounds[0].toFixed(2)}, y=${bounds[1].toFixed(2)}, w=${bounds[2].toFixed(2)}, h=${bounds[3].toFixed(2)}`);
                alert(`图层边界:\nx: ${bounds[0].toFixed(2)}\ny: ${bounds[1].toFixed(2)}\n宽度: ${bounds[2].toFixed(2)}\n高度: ${bounds[3].toFixed(2)}`);
            }
        };

        window.renderAll = function() {
            const result = layerStack.render_composite();
            const base64 = result.get_base64();
            
            const canvas = document.getElementById('mainCanvas');
            const ctx = canvas.getContext('2d');
            
            const img = new Image();
            img.onload = function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
            };
            img.src = base64;
        };

        window.loadLayerTransform = function() {
            const layer = layerStack.get_layer(currentLayerId);
            if (!layer) return;
            
            document.getElementById('scaleX').value = layer.scale_x;
            document.getElementById('scaleY').value = layer.scale_y;
            document.getElementById('rotation').value = layer.rotation_degrees;
            document.getElementById('posX').value = layer.position_x;
            document.getElementById('posY').value = layer.position_y;
            document.getElementById('originX').value = layer.origin_x;
            document.getElementById('originY').value = layer.origin_y;
            
            window.updateValueDisplays();
        };

        window.updateValueDisplays = function() {
            document.getElementById('scaleX-val').textContent = parseFloat(document.getElementById('scaleX').value).toFixed(1);
            document.getElementById('scaleY-val').textContent = parseFloat(document.getElementById('scaleY').value).toFixed(1);
            document.getElementById('rotation-val').textContent = document.getElementById('rotation').value + '°';
            document.getElementById('posX-val').textContent = document.getElementById('posX').value;
            document.getElementById('posY-val').textContent = document.getElementById('posY').value;
            document.getElementById('originX-val').textContent = parseFloat(document.getElementById('originX').value).toFixed(1);
            document.getElementById('originY-val').textContent = parseFloat(document.getElementById('originY').value).toFixed(1);
        };
    </script>
    <script type="module">
        import init, { LayerStack } from './pkg/photon_wasm.js';

        function createRedSquare() {
            const pixels = new Uint8Array(400 * 400 * 4);
            for (let i = 0; i < pixels.length; i += 4) {
                const x = (i / 4) % 400;
                const y = Math.floor((i / 4) / 400);
                const centerX = 200, centerY = 200;
                const size = 150;  // 增大方块尺寸
                
                if (x >= centerX - size && x <= centerX + size &&
                    y >= centerY - size && y <= centerY + size) {
                    pixels[i] = 255;     // R
                    pixels[i + 1] = 0;   // G
                    pixels[i + 2] = 0;   // B
                    pixels[i + 3] = 255; // A
                } else {
                    pixels[i + 3] = 0;   // 透明
                }
            }
            return pixels;
        }

        function createBlueCircle() {
            const pixels = new Uint8Array(400 * 400 * 4);
            for (let i = 0; i < pixels.length; i += 4) {
                const x = (i / 4) % 400;
                const y = Math.floor((i / 4) / 400);
                const centerX = 200, centerY = 200;
                const radius = 120;  // 增大圆形半径
                
                const dx = x - centerX;
                const dy = y - centerY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist <= radius) {
                    pixels[i] = 0;       // R
                    pixels[i + 1] = 0;   // G
                    pixels[i + 2] = 255; // B
                    pixels[i + 3] = 255; // A
                } else {
                    pixels[i + 3] = 0;   // 透明
                }
            }
            return pixels;
        }

        async function initWasm() {
            await init();
            
            // 创建图层堆栈
            layerStack = new LayerStack(400, 400);
            
            // 创建图层1（红色方块）
            const layer1Data = createRedSquare();
            const layer1Id = layerStack.add_layer_from_pixels(layer1Data, "图层1");
            
            // 创建图层2（蓝色圆形）
            const layer2Data = createBlueCircle();
            const layer2Id = layerStack.add_layer_from_pixels(layer2Data, "图层2");
            
            // 设置图层2的位置
            layerStack.set_layer_position(layer2Id, 50, 50);
            
            window.renderAll();
            console.log("WASM 初始化完成");
        }

        // 画布点击事件
        document.getElementById('mainCanvas').addEventListener('click', (e) => {
            if (isSettingTransformCenter) {
                const rect = e.target.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                document.getElementById('transformCenterX').value = x.toFixed(0);
                document.getElementById('transformCenterY').value = y.toFixed(0);
                
                window.setTransformCenter();
                
                isSettingTransformCenter = false;
                document.getElementById('mainCanvas').style.cursor = 'default';
            }
        });

        // 初始化
        initWasm();
    </script>
</body>
</html>
